name: HACS Release Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify HACS release discovery and package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python -c 'import json; print(json.load(open("custom_components/winnes_gps/manifest.json"))["version"])')"
          TAG="v${VERSION}"

          # HACS 2.0.5 uses GitHub's list-releases API. Prove the authenticated
          # endpoint sees the current release, with retries for transient GitHub 5xx errors.
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > /tmp/releases.json; then
              ok=1
              break
            fi
            echo "GitHub releases API attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          test "$ok" = 1

          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          tag = f'v{version}'
          releases = json.load(open('/tmp/releases.json'))
          print('authenticated release tags:', [r.get('tag_name') for r in releases])

          stable = [r for r in releases if not r.get('draft') and not r.get('prerelease')]
          if not stable or stable[0].get('tag_name') != tag:
              raise SystemExit(f'HACS-style release selection did not choose {tag}')

          release = stable[0]
          asset = next((a for a in release.get('assets', []) if a.get('name') == 'winnes_gps.zip'), None)
          if asset is None:
              raise SystemExit('winnes_gps.zip is missing from latest stable release')

          headers = {'User-Agent': 'winnes-gps-hacs-smoke'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status} for {url}')
                  return response.read()

          hacs = json.loads(get(f'https://raw.githubusercontent.com/{repo}/{tag}/hacs.json'))
          if hacs.get('zip_release') is not True or hacs.get('filename') != 'winnes_gps.zip':
              raise SystemExit('tagged hacs.json does not point HACS to winnes_gps.zip')

          archive = get(asset['browser_download_url'])
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              required = {'__init__.py', 'manifest.json', 'config_flow.py', 'api.py', 'coordinator.py'}
              missing = required - set(zf.namelist())
              if missing:
                  raise SystemExit(f'release ZIP missing {sorted(missing)}')
              zipped_manifest = json.loads(zf.read('manifest.json'))
              if zipped_manifest.get('version') != version:
                  raise SystemExit('release ZIP version does not match release tag')

          print(f'PASS: HACS 2.0.5 release-list logic selects {tag}; release ZIP is valid')
          PY
