name: HACS Release Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify public GitHub release discovery and HACS package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import pathlib
          import urllib.request
          import zipfile

          repo = "${{ github.repository }}"
          manifest = json.loads(pathlib.Path("custom_components/winnes_gps/manifest.json").read_text())
          tag = "v" + manifest["version"]
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "winnes-gps-hacs-smoke",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(response.status, url)
                  return response.read()

          releases = json.loads(get(f"https://api.github.com/repos/{repo}/releases?per_page=30"))
          print("public release tags:", [r.get("tag_name") for r in releases])
          stable = [r for r in releases if not r.get("draft") and not r.get("prerelease")]
          if not stable:
              raise SystemExit("No stable GitHub releases visible through the public list endpoint")
          if stable[0].get("tag_name") != tag:
              raise SystemExit(f"HACS would select {stable[0].get('tag_name')!r}, expected {tag!r}")

          release = stable[0]
          asset = next((a for a in release.get("assets", []) if a.get("name") == "winnes_gps.zip"), None)
          if asset is None:
              raise SystemExit("Latest stable release has no winnes_gps.zip asset")

          hacs = json.loads(get(f"https://raw.githubusercontent.com/{repo}/{tag}/hacs.json"))
          if hacs.get("zip_release") is not True or hacs.get("filename") != "winnes_gps.zip":
              raise SystemExit("Tagged hacs.json is not configured for the release ZIP")

          archive = get(asset["browser_download_url"])
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              required = {"__init__.py", "manifest.json", "config_flow.py", "api.py", "coordinator.py"}
              missing = required - set(zf.namelist())
              if missing:
                  raise SystemExit(f"Release ZIP missing: {sorted(missing)}")
              zipped_manifest = json.loads(zf.read("manifest.json"))
              if zipped_manifest.get("version") != manifest["version"]:
                  raise SystemExit("Release ZIP manifest version does not match main manifest")

          print(f"PASS: public release list exposes {tag}, HACS selects it, and winnes_gps.zip validates")
          PY
