name: HACS Release Smoke

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve released commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Verify HACS 2.0.5 release discovery and standard archive install path
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python -c 'import json; print(json.load(open("custom_components/winnes_gps/manifest.json"))["version"])')"
          TAG="v${VERSION}"

          # HACS 2.0.5 decides Version vs Commit mode from GitHub's release list.
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > /tmp/releases.json; then
              ok=1
              break
            fi
            echo "GitHub releases API attempt $attempt failed; retrying..."
            sleep $((attempt * 4))
          done
          test "$ok" = 1

          python - <<'PY'
          import json

          version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          tag = f'v{version}'
          releases = json.load(open('/tmp/releases.json'))
          print('release tags:', [r.get('tag_name') for r in releases])

          stable = [r for r in releases if not r.get('draft') and not r.get('prerelease')]
          if not stable:
              raise SystemExit('HACS would see no stable GitHub release and fall back to Commit mode')
          if stable[0].get('tag_name') != tag:
              raise SystemExit(f"HACS would select {stable[0].get('tag_name')!r}, expected {tag!r}")
          print(f'PASS: HACS release selection resolves to Version {tag}')
          PY

          # Read the exact metadata HACS will use for the selected tag.
          for target in hacs.json custom_components/winnes_gps/manifest.json; do
            output="/tmp/$(basename "$target")"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh api \
                -H 'Accept: application/vnd.github.raw+json' \
                "repos/$GITHUB_REPOSITORY/contents/$target?ref=$TAG" > "$output"; then
                ok=1
                break
              fi
              echo "Contents API attempt $attempt failed for $target; retrying..."
              sleep $((attempt * 4))
            done
            test "$ok" = 1
          done

          python - <<'PY'
          import json

          local_version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          hacs = json.load(open('/tmp/hacs.json'))
          tagged_manifest = json.load(open('/tmp/manifest.json'))

          if hacs.get('zip_release') is True:
              raise SystemExit('tagged hacs.json unexpectedly enables zip_release')
          if 'filename' in hacs:
              raise SystemExit('tagged hacs.json unexpectedly forces a release filename')
          if hacs.get('hide_default_branch') is not True:
              raise SystemExit('tagged hacs.json must keep the default branch hidden')
          if tagged_manifest.get('version') != local_version:
              raise SystemExit('tagged integration manifest version does not match released commit')
          print('PASS: tagged HACS metadata selects the standard repository archive path')
          PY

          # HACS 2.0.5 download_repository_zip() strips its internal tags/ prefix
          # and downloads exactly archive/refs/tags/<version>.zip for a release.
          ARCHIVE_URL="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.zip"
          curl --fail --location --retry 5 --retry-delay 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output /tmp/repository.zip "$ARCHIVE_URL"

          python - <<'PY'
          import json
          import zipfile

          version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          required = {
              '__init__.py',
              'manifest.json',
              'config_flow.py',
              'api.py',
              'coordinator.py',
          }

          with zipfile.ZipFile('/tmp/repository.zip') as archive:
              names = archive.namelist()
              manifest_candidates = [
                  name for name in names
                  if name.endswith('/custom_components/winnes_gps/manifest.json')
              ]
              if len(manifest_candidates) != 1:
                  raise SystemExit(
                      f'expected one integration manifest in tagged archive, got {manifest_candidates}'
                  )
              base = manifest_candidates[0][:-len('manifest.json')]
              missing = [name for name in required if f'{base}{name}' not in names]
              if missing:
                  raise SystemExit(f'tagged repository archive missing required files: {sorted(missing)}')
              manifest = json.loads(archive.read(f'{base}manifest.json'))
              if manifest.get('version') != version:
                  raise SystemExit('tagged repository archive manifest version mismatch')

          print(f'PASS: HACS standard tagged repository archive is complete for version {version}')
          PY
