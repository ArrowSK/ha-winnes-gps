name: HACS Release Smoke

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve released commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Verify HACS release discovery and package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python -c 'import json; print(json.load(open("custom_components/winnes_gps/manifest.json"))["version"])')"
          TAG="v${VERSION}"

          # HACS 2.0.5 decides Version vs Commit mode from GitHub's list-releases API.
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > /tmp/releases.json; then
              ok=1
              break
            fi
            echo "GitHub releases API attempt $attempt failed; retrying..."
            sleep $((attempt * 4))
          done
          test "$ok" = 1

          python - <<'PY'
          import json
          import os

          version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          tag = f'v{version}'
          releases = json.load(open('/tmp/releases.json'))
          print('release tags:', [r.get('tag_name') for r in releases])

          stable = [r for r in releases if not r.get('draft') and not r.get('prerelease')]
          if not stable:
              raise SystemExit('HACS would see no stable GitHub release and fall back to Commit mode')
          if stable[0].get('tag_name') != tag:
              raise SystemExit(f"HACS would select {stable[0].get('tag_name')!r}, expected {tag!r}")

          release = stable[0]
          asset = next((a for a in release.get('assets', []) if a.get('name') == 'winnes_gps.zip'), None)
          if asset is None:
              raise SystemExit('latest stable release has no winnes_gps.zip asset')

          with open('/tmp/asset-url', 'w') as file:
              file.write(asset['browser_download_url'])
          print(f'PASS: HACS release selection resolves to Version {tag}')
          PY

          # HACS loads latest-release metadata through GitHub repository contents.
          # Use the authenticated Contents API instead of raw.githubusercontent.com,
          # whose separate anonymous throttling is not the release-selection path.
          for target in hacs.json custom_components/winnes_gps/manifest.json; do
            output="/tmp/$(basename "$target")"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh api \
                -H 'Accept: application/vnd.github.raw+json' \
                "repos/$GITHUB_REPOSITORY/contents/$target?ref=$TAG" > "$output"; then
                ok=1
                break
              fi
              echo "Contents API attempt $attempt failed for $target; retrying..."
              sleep $((attempt * 4))
            done
            test "$ok" = 1
          done

          python - <<'PY'
          import json

          local_version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          hacs = json.load(open('/tmp/hacs.json'))
          tagged_manifest = json.load(open('/tmp/manifest.json'))

          if hacs.get('zip_release') is not True:
              raise SystemExit('tagged hacs.json does not enable zip_release')
          if hacs.get('filename') != 'winnes_gps.zip':
              raise SystemExit('tagged hacs.json does not name winnes_gps.zip')
          if tagged_manifest.get('version') != local_version:
              raise SystemExit('tagged integration manifest version does not match released commit')
          print('PASS: tagged HACS metadata and integration manifest validate')
          PY

          # HACS zip_release downloads this published release asset. Follow redirects
          # and retry transient 429/5xx/network failures, then inspect the exact ZIP.
          ASSET_URL="$(cat /tmp/asset-url)"
          curl --fail --location --retry 5 --retry-delay 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output /tmp/winnes_gps.zip "$ASSET_URL"

          python - <<'PY'
          import json
          import zipfile

          version = json.load(open('custom_components/winnes_gps/manifest.json'))['version']
          required = {'__init__.py', 'manifest.json', 'config_flow.py', 'api.py', 'coordinator.py'}
          with zipfile.ZipFile('/tmp/winnes_gps.zip') as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'release ZIP missing required files: {sorted(missing)}')
              manifest = json.loads(archive.read('manifest.json'))
              if manifest.get('version') != version:
                  raise SystemExit('release ZIP manifest version does not match released version')
          print(f'PASS: published winnes_gps.zip is complete and version {version}')
          PY
