name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository invariants
        run: python scripts/validate.py
      - name: Run parser/model tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q custom_components scripts tests

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # This repository is initially distributed as a HACS custom repository.
          # GitHub listing metadata cannot be set from repository contents.
          ignore: topics description

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
