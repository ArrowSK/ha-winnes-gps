name: Release

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winnes-gps-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/winnes_gps/manifest.json').read_text())
          print(manifest['version'])
          PY
          )"
          if [[ -z "$VERSION" ]]; then
            echo "Integration version is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl -sS -o /tmp/release-check.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || true)"
            if [[ "$STATUS" == "200" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$STATUS" == "404" ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release lookup attempt $attempt returned HTTP ${STATUS:-unknown}; retrying..."
            sleep $((attempt * 4))
          done
          echo "Could not determine whether $TAG exists; refusing to guess."
          exit 1

      - name: Build HACS release archive
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/winnes_gps
          zip -r "$GITHUB_WORKSPACE/winnes_gps.zip" . \
            -x "*/__pycache__/*" "*.pyc" "*.pyo"

      - name: Create GitHub release with HACS archive
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Release creation attempt $attempt for $TAG"
            if gh release create "$TAG" "$GITHUB_WORKSPACE/winnes_gps.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "WINNES GPS $VERSION" \
              --generate-notes; then
              success=1
              break
            fi

            # A transient API error can occur after GitHub has already created the
            # release. Check before retrying so we do not turn a successful partial
            # request into a false failure.
            sleep $((attempt * 4))
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > /tmp/release-view.json 2>/dev/null; then
              if python - <<'PY'
          import json
          data = json.load(open('/tmp/release-view.json'))
          raise SystemExit(0 if any(a.get('name') == 'winnes_gps.zip' for a in data.get('assets', [])) else 1)
          PY
              then
                echo "$TAG exists and already contains winnes_gps.zip."
                success=1
                break
              fi

              echo "$TAG exists but its ZIP asset is missing; completing this newly-created release."
              if gh release upload "$TAG" "$GITHUB_WORKSPACE/winnes_gps.zip" \
                --repo "$GITHUB_REPOSITORY"; then
                success=1
                break
              fi
            fi
          done

          if [[ "$success" != "1" ]]; then
            echo "Could not create a complete $TAG release after five attempts."
            exit 1
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
          EXISTING_RELEASE: ${{ steps.existing.outputs.exists }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,targetCommitish,assets > /tmp/release-verify.json; then
              if python - <<'PY'
          import json
          import os
          data = json.load(open('/tmp/release-verify.json'))
          expected_tag = os.environ['TAG']
          expected_sha = os.environ['TARGET_SHA']
          existing_release = os.environ.get('EXISTING_RELEASE') == 'true'
          if data.get('tagName') != expected_tag:
              raise SystemExit(1)
          if data.get('isDraft') or data.get('isPrerelease'):
              raise SystemExit(1)
          # A previously published immutable version is expected to target the
          # commit that created that version, not every later metadata-only main
          # commit that keeps the same manifest version.
          if not existing_release and data.get('targetCommitish') != expected_sha:
              raise SystemExit(1)
          if not any(a.get('name') == 'winnes_gps.zip' for a in data.get('assets', [])):
              raise SystemExit(1)
          PY
              then
                ok=1
                break
              fi
            fi
            echo "Release verification attempt $attempt failed; retrying..."
            sleep $((attempt * 4))
          done
          if [[ "$ok" != "1" ]]; then
            echo "Published release did not pass verification."
            exit 1
          fi
          if [[ "$EXISTING_RELEASE" == "true" ]]; then
            echo "Verified existing stable $TAG with winnes_gps.zip."
          else
            echo "Verified new stable $TAG targeting $TARGET_SHA with winnes_gps.zip."
          fi

      # HACS 2.0.5 can cache the repository ETag before a just-created release is
      # visible. For an uninstalled custom repository that 304 response returns
      # before HACS checks releases again, leaving the UI in Commit mode. Make one
      # harmless main-branch commit only after a new release is verified so the
      # next HACS refresh necessarily re-runs release discovery. The follow-up
      # validation sees an already-existing release, so this cannot loop.
      - name: Refresh repository metadata after a new release
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          CURRENT_TAG="v$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/winnes_gps/manifest.json').read_text())
          print(manifest['version'])
          PY
          )"
          if [[ "$CURRENT_TAG" != "$TAG" ]]; then
            echo "main has moved to $CURRENT_TAG; its own release run will refresh metadata."
            exit 0
          fi

          mkdir -p .github
          printf 'release=%s\ntarget=%s\n' "$TAG" "$TARGET_SHA" > .github/hacs-release-state
          if [[ -z "$(git status --porcelain -- .github/hacs-release-state)" ]]; then
            echo "HACS release-state marker already matches $TAG."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/hacs-release-state
          git commit -m "Refresh HACS release discovery for $TAG"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published post-release metadata refresh for $TAG."
              exit 0
            fi
            echo "Metadata refresh push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "Could not publish the post-release metadata refresh."
          exit 1

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            echo "Release ${{ steps.version.outputs.tag }} already existed and passed verification; no release files were rewritten." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Created release ${{ steps.version.outputs.tag }} with winnes_gps.zip, verified it, and refreshed repository metadata for HACS discovery." >> "$GITHUB_STEP_SUMMARY"
          fi
