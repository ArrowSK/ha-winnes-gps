name: Release

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/winnes_gps/manifest.json').read_text())
          print(manifest['version'])
          PY
          )"
          if [[ -z "$VERSION" ]]; then
            echo "Integration version is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build HACS release archive
        shell: bash
        run: |
          cd custom_components/winnes_gps
          zip -r "$GITHUB_WORKSPACE/winnes_gps.zip" . \
            -x "*/__pycache__/*" "*.pyc" "*.pyo"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release with HACS archive
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh release create "$TAG" "$GITHUB_WORKSPACE/winnes_gps.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "WINNES GPS $VERSION" \
            --generate-notes

      - name: Refresh HACS archive on existing release
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" "$GITHUB_WORKSPACE/winnes_gps.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            echo "Updated ${{ steps.version.outputs.tag }} with winnes_gps.zip for HACS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Created ${{ steps.version.outputs.tag }} with winnes_gps.zip for HACS." >> "$GITHUB_STEP_SUMMARY"
          fi
